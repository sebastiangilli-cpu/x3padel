// ── Bracket seeding helpers ──────────────────────────────────────────
function nextPow2(n) { let p=1; while(p<n) p*=2; return p; }
function pairLabel(pair) { return `${pair.p1.split(' ')[0]}/${pair.p2.split(' ')[0]}`; }

// Phase map keyed by bracketSize:
// prev = previa phase (where non-seeded pairs play)
// main = first main-round phase (where seeded bye pairs enter)
const BRACKET_PHASE_MAP = {
  2:  { prev:'final',   main:'final'   },
  4:  { prev:'semis',   main:'final'   },
  8:  { prev:'cuartos', main:'semis'   },
  16: { prev:'8avos',   main:'cuartos' },
  32: { prev:'16avos',  main:'8avos'   },
};

// FAP predefined bracket templates.
// Key: `${nClassifiers}_${nThirds}` (nThirds = count of 3rd-place classifiers, i.e. zones of 4 pairs).
// slots: bracket positions top→bottom ["rankZone"], e.g. "1A"=1st of zone A, "3B"=3rd of zone B.
// byeIdx: indices into slots[] that skip the previa (get byes), stored in rank order
//         (best bye first) so advanceBracket places them correctly via generateBracketSeedOrder.
// Source: FAP Reglamento de Torneos – bracket draw tables (pp. 124-145).
const FAP_BRACKET_TEMPLATES = {
  // ── 4 classifiers (6 total pairs – 2 zones of 3) ──────────── nByes=0, semis ──
  '4_0': { slots:['1A','2B','2A','1B'], byeIdx:[] },

  // ── 5 classifiers (7 total pairs – 1 zone of 4 + 1 zone of 3) ─ nByes=3, semis ─
  '5_1': { slots:['1A','3A','2B','2A','1B'], byeIdx:[0,3,4] },
  // byes: 1A(rank1), 2A(rank2), 1B(rank3)  |  previa: 3A vs 2B → winner plays 1A

  // ── 6 classifiers (9 total pairs – 3 zones of 3) ─────────── nByes=2, semis ──
  '6_0': { slots:['1A','2B','2C','1C','2A','1B'], byeIdx:[0,5] },
  // byes: 1A, 1B  |  previa (cuartos): 2B vs 2C, 1C vs 2A

  // ── 8 classifiers – no thirds (12 total pairs – 4 zones of 3) ─ nByes=0, cuartos ─
  '8_0': { slots:['1A','2B','2C','1D','1C','2D','2A','1B'], byeIdx:[] },

  // ── 8 classifiers – 2 thirds (11 total pairs – 2 zones of 4 + 1 zone of 3) ─ nByes=0 ─
  '8_2': { slots:['1A','3B','2B','2C','1C','2A','3A','1B'], byeIdx:[] },

  // ── 10 classifiers (14 total pairs – 2 zones of 4 + 2 zones of 3) ─ nByes=6, 8avos ─
  '10_2': { slots:['1A','3A','2B','2C','1D','1C','2D','2A','3B','1B'],
            byeIdx:[0,9,5,4,3,6] },
  // byes rank order: 1A,1B,1C,1D,2C,2D  |  previa(8avos): 3A vs 2B, 2A vs 3B

  // ── 14 classifiers (20 total pairs – 2 zones of 4 + 4 zones of 3) ─ nByes=2, 8avos ─
  '14_2': { slots:['1A','2C','2F','1E','2B','3A','1D','1C','3B','2A','1F','2E','2D','1B'],
             byeIdx:[0,13] },
  // byes: 1A, 1B  |  previa(8avos): 2C/2F, 1E/2B, 3A/1D, 1C/3B, 2A/1F, 2E/2D
};

// Standard tournament bracket seeding order for n slots (top-to-bottom).
// Ensures seeds 1 and 2 only meet in the final, 3 and 4 only in semis, etc.
// E.g. n=8 → [1,8,5,4,3,6,7,2]
function generateBracketSeedOrder(n) {
  if (n <= 1) return [1];
  if (n === 2) return [1, 2];
  const half = generateBracketSeedOrder(n / 2);
  const result = [];
  for (let i = 0; i < half.length; i++) {
    const s = half[i];
    if (i % 2 === 0) { result.push(s, n + 1 - s); }   // even index: lower seed first
    else             { result.push(n + 1 - s, s); }    // odd index:  higher seed first (reversed)
  }
  return result;
}

function genInitialBracket() {
  try {
  const t = db.tournaments.find(t=>t.id===activeTId);
  const zones = getZones(t.id); // sorted A→Z

  // Build classifMap: { zoneLetter: { rank: { pair, zone, rank } } }
  const classifMap = {};
  zones.forEach(zone => {
    const ms = zoneMatches(t.id, zone.letter);
    const stand = standingsForZone(zone.pairs, ms);
    const qualN = zone.pairs.length === 4 ? 3 : 2;
    classifMap[zone.letter] = {};
    for (let r = 0; r < qualN; r++) {
      if (stand[r]) classifMap[zone.letter][r + 1] = { pair: stand[r].pair, zone: zone.letter, rank: r + 1 };
    }
  });

  // Build ordered classif list: 1sts A→Z, 2nds A→Z, 3rds A→Z
  const classif = [];
  [1, 2, 3].forEach(rank => {
    zones.forEach(z => {
      const c = classifMap[z.letter] && classifMap[z.letter][rank];
      if (c) classif.push(c);
    });
  });

  if (classif.length < 2) { alert('Necesitás al menos 2 parejas clasificadas'); return; }

  db.matches = db.matches.filter(m => !(m.tId === t.id && m.phase !== 'zonas'));

  const n        = classif.length;
  const bSize    = nextPow2(n);
  const nByes    = bSize - n;
  const phMap    = BRACKET_PHASE_MAP[bSize] || BRACKET_PHASE_MAP[32];
  const firstPhase = phMap.prev;
  const mainSlots  = bSize / 2;
  const seedLabel  = c => `${c.zone}${c.rank}`;
  const nThirds    = classif.filter(c => c.rank === 3).length;
  const tplKey     = `${n}_${nThirds}`;
  const fapTpl     = FAP_BRACKET_TEMPLATES[tplKey];
  let mn = 0;

  if (fapTpl) {
    // ── FAP predefined bracket ──────────────────────────────────────────────
    // Build lookup "1A" → classif entry
    const bySlot = {};
    classif.forEach(c => { bySlot[`${c.rank}${c.zone}`] = c; });
    const slots = fapTpl.slots.map(s => bySlot[s] || null);
    const byeSet = new Set(fapTpl.byeIdx);

    // byePairs in rank order (byeIdx order) for advanceBracket slot placement
    const orderedByePairs = fapTpl.byeIdx
      .map(i => slots[i]).filter(Boolean)
      .map(c => ({ id:c.pair.id, label:pairLabel(c.pair), seed:seedLabel(c) }));

    t.bracketInfo = {
      previaPhase: nByes > 0 ? firstPhase : null,
      mainPhase:   phMap.main,
      bSize, mainSlots,
      byePairs: orderedByePairs,
    };

    // Create previa matches in FAP order: adjacent non-bye slots pair up
    const previaSlots = slots.filter((_, i) => !byeSet.has(i));
    for (let i = 0; i + 1 < previaSlots.length; i += 2) {
      const a = previaSlots[i], b = previaSlots[i + 1];
      if (!a || !b) continue;
      mn++;
      db.matches.push({ id:uid(), tId:t.id, phase:firstPhase, zone:null, matchNum:mn,
        p1Id:a.pair.id, p2Id:b.pair.id,
        p1Label:pairLabel(a.pair), p2Label:pairLabel(b.pair),
        p1Seed:seedLabel(a), p2Seed:seedLabel(b),
        sets:[[null,null],[null,null],[null,null]], winner:null });
    }

  } else {
    // ── Fallback: seeded bracket (non-FAP size) ─────────────────────────────
    const seeded = classif;
    const byeSeeds    = seeded.slice(0, nByes);
    const previaPairs = seeded.slice(nByes);
    const nP = previaPairs.length;

    // Reorder bye seeds using standard bracket-position order
    let orderedByePairs = [];
    if (nByes > 0) {
      const so = generateBracketSeedOrder(mainSlots);
      for (const rank of so) {
        if (rank <= nByes) {
          const c = byeSeeds[rank - 1];
          orderedByePairs.push({ id:c.pair.id, label:pairLabel(c.pair), seed:seedLabel(c) });
        }
      }
    }
    t.bracketInfo = {
      previaPhase: nByes > 0 ? phMap.prev : null,
      mainPhase:   phMap.main,
      bSize, mainSlots,
      byePairs: orderedByePairs,
    };

    if (nByes === 0) {
      const so = generateBracketSeedOrder(nP);
      for (let i = 0; i < nP - 1; i += 2) {
        mn++;
        const a = previaPairs[so[i] - 1], b = previaPairs[so[i + 1] - 1];
        db.matches.push({ id:uid(), tId:t.id, phase:firstPhase, zone:null, matchNum:mn,
          p1Id:a.pair.id, p2Id:b.pair.id,
          p1Label:pairLabel(a.pair), p2Label:pairLabel(b.pair),
          p1Seed:seedLabel(a), p2Seed:seedLabel(b),
          sets:[[null,null],[null,null],[null,null]], winner:null });
      }
    } else {
      for (let i = 0; i < Math.floor(nP / 2); i++) {
        mn++;
        const a = previaPairs[i], b = previaPairs[nP - 1 - i];
        db.matches.push({ id:uid(), tId:t.id, phase:firstPhase, zone:null, matchNum:mn,
          p1Id:a.pair.id, p2Id:b.pair.id,
          p1Label:pairLabel(a.pair), p2Label:pairLabel(b.pair),
          p1Seed:seedLabel(a), p2Seed:seedLabel(b),
          sets:[[null,null],[null,null],[null,null]], winner:null });
      }
      if (nP % 2 === 1) {
        mn++;
        const mid = previaPairs[Math.floor(nP / 2)];
        db.matches.push({ id:uid(), tId:t.id, phase:firstPhase, zone:null, matchNum:mn,
          p1Id:mid.pair.id, p2Id:null,
          p1Label:pairLabel(mid.pair), p2Label:'BYE',
          p1Seed:seedLabel(mid), p2Seed:null,
          sets:[[null,null],[null,null],[null,null]], winner:'p1' });
      }
    }
  }

  saveDB(); render();
  } catch(e) { alert('Error generando bracket: ' + e.message + '\n' + e.stack); }
}

function advanceBracket() {
  const t = db.tournaments.find(t=>t.id===activeTId);
  const bm = db.matches.filter(m=>m.tId===t.id && m.phase!=='zonas');
  const bmPhases = BRACKET_ORDER.filter(ph=>bm.some(m=>m.phase===ph));
  if (bmPhases.length === 0) { genInitialBracket(); return; }

  const currentPhase = bmPhases[bmPhases.length-1];
  const currentMatches = bm.filter(m=>m.phase===currentPhase).sort((a,b)=>a.matchNum-b.matchNum);

  if (!currentMatches.every(m=>m.winner)) {
    alert('Completá todos los resultados de la ronda actual antes de avanzar.');
    return;
  }
  if (currentPhase === 'final') { alert('¡El torneo ya tiene campeón!'); return; }

  const nextPhase = BRACKET_ORDER[BRACKET_ORDER.indexOf(currentPhase)+1];
  db.matches = db.matches.filter(m=>!(m.tId===t.id && m.phase===nextPhase));

  const winners = currentMatches.map(m=>({
    label: m.winner==='p1' ? m.p1Label : m.p2Label,
    id:    m.winner==='p1' ? m.p1Id   : m.p2Id,
    seed:  m.winner==='p1' ? m.p1Seed : m.p2Seed,
  }));

  const bi = t.bracketInfo || {};
  let mn = 0;

  // Previa → main: build main-phase bracket using standard slot-array approach.
  // byePairs are already stored in bracket-position order (top→bottom).
  // Previa winners (in matchNum order) fill the remaining slots determined by
  // the standard bracket seed order for mainSlots positions.
  if (bi.previaPhase && currentPhase === bi.previaPhase && bi.byePairs && bi.byePairs.length > 0) {
    const orderedByePairs = bi.byePairs; // already in bracket-position order
    const nByes      = orderedByePairs.length;
    const mainSlots  = bi.mainSlots || (bi.bSize / 2);
    const seedOrder  = generateBracketSeedOrder(mainSlots);

    // Build slot array: for each slot, assign a bye or previa winner in order
    let byeIdx = 0, prevIdx = 0;
    const slots = [];
    for (const rank of seedOrder) {
      if (rank <= nByes) {
        slots.push(orderedByePairs[byeIdx++]);
      } else {
        const w = winners[prevIdx++] || { id:null, label:'BYE', seed:null };
        slots.push(w);
      }
    }

    // Generate matches from consecutive slot pairs
    for (let i = 0; i < slots.length - 1; i += 2) {
      mn++;
      const a = slots[i], b = slots[i + 1];
      const autoWin = a.id === null ? 'p2' : b.id === null ? 'p1' : null;
      db.matches.push({ id:uid(), tId:t.id, phase:nextPhase, zone:null, matchNum:mn,
        p1Id:a.id, p2Id:b.id, p1Label:a.label, p2Label:b.label,
        p1Seed:a.seed||null, p2Seed:b.seed||null,
        sets:[[null,null],[null,null],[null,null]], winner:autoWin });
    }

  } else {
    // Subsequent rounds: sequential pairing — adjacent match winners play each other.
    // This is correct when the bracket was built with standard slot-array seeding
    // (nByes=0 case) or after the previa→main slot-array transition.
    // Adjacent match pairs form the correct bracket sections so top seeds stay
    // in opposite halves and can only meet in the final.
    const nW = winners.length;
    for (let i = 0; i < nW - 1; i += 2) {
      mn++;
      const a = winners[i], b = winners[i + 1];
      const autoWin = a.id === null ? 'p2' : b.id === null ? 'p1' : null;
      db.matches.push({ id:uid(), tId:t.id, phase:nextPhase, zone:null, matchNum:mn,
        p1Id:a.id, p2Id:b.id, p1Label:a.label, p2Label:b.label,
        p1Seed:a.seed||null, p2Seed:b.seed||null,
        sets:[[null,null],[null,null],[null,null]], winner:autoWin });
    }
    // Odd winner (power-of-2 brackets avoid this, but just in case)
    if (nW % 2 === 1) {
      mn++;
      const mid = winners[Math.floor(nW / 2)];
      db.matches.push({ id:uid(), tId:t.id, phase:nextPhase, zone:null, matchNum:mn,
        p1Id:mid.id, p2Id:null, p1Label:mid.label, p2Label:'BYE',
        p1Seed:mid.seed||null, p2Seed:null,
        sets:[[null,null],[null,null],[null,null]], winner:'p1' });
    }
  }

  saveDB(); render();
}

function saveBracketMatchTime(matchId, field, value) {
  const m = db.matches.find(x=>x.id===matchId); if (!m) return;
  if (field === 'day')  m.matchDay  = value || null;
  if (field === 'time') m.matchTime = value || null;

function setBracketScore(matchId, setIdx, side, value) {
  const m = db.matches.find(x=>x.id===matchId); if (!m) return;
  m.sets[setIdx][side] = value===''?null:parseInt(value);
  let p1s=0, p2s=0;
  m.sets.forEach(([a,b]) => { if(a!==null&&b!==null){if(+a>+b)p1s++;else if(+b>+a)p2s++;} });
  m.winner = p1s>=2?'p1':p2s>=2?'p2':null;
  saveDB();
  clearTimeout(window._rt);
  window._rt = setTimeout(render, 400);
}

// Returns array of unavailable days, handling both old (string) and new (array) format
function getPairUnavailDays(pair) {
  if (pair.unavailableDays && pair.unavailableDays.length > 0) return pair.unavailableDays;
  if (pair.unavailableDay) return [pair.unavailableDay];
  return [];
}

// Returns how many unique play days a tournament has
function getTournamentUniqueDays(t) {
  const days = t.playSlots ? t.playSlots.map(s=>s.day).filter(Boolean)
                           : (t.playDays || []);
  return [...new Set(days)];
}

function getZones(tId) {
  const pairs = db.pairs.filter(p=>p.tId===tId && p.zone);
  const letters = [...new Set(pairs.map(p=>p.zone))].sort();
  return letters.map(letter => ({
    letter,
    pairs: pairs.filter(p=>p.zone===letter).sort((a,b)=>a.pos-b.pos)
  }));
}

function zoneMatches(tId, zone) {
  return db.matches.filter(m=>m.tId===tId && m.zone===zone && m.phase==='zonas');
}

// For zone-of-4: determine positions from bracket match outcomes (M3 winner=1st,
// M3 loser=2nd, M4 winner=3rd, M4 loser=4th). Falls back to PG-based standings
// for incomplete zones or zones-of-3.
// Compute raw stats (pg, sg, sp, jg, jp) for each pair from match results
function computeStats(pairs, matches) {
  const st = {};
  pairs.forEach(p => { st[p.id] = { pair:p, pg:0, pp:0, sg:0, sp:0, jg:0, jp:0 }; });
  matches.forEach(m => {
    if (!m.winner) return;
    let sg1=0,sg2=0,jg1=0,jp1=0,jg2=0,jp2=0;
    m.sets.forEach(([a,b]) => {
      if (a===null||b===null||a===''||b==='') return;
      a=+a; b=+b;
      if (a>b) { sg1++; jg1+=a; jp1+=b; }
      else if (b>a) { sg2++; jg2+=b; jp2+=a; }
    });
    if (st[m.p1Id]) { const s=st[m.p1Id]; if(m.winner==='p1')s.pg++;else s.pp++; s.sg+=sg1;s.sp+=sg2;s.jg+=jg1;s.jp+=jp1; }
    if (st[m.p2Id]) { const s=st[m.p2Id]; if(m.winner==='p2')s.pg++;else s.pp++; s.sg+=sg2;s.sp+=sg1;s.jg+=jg2;s.jp+=jp2; }
  });
  return st;
}

// For zone-of-4: positions are determined by bracket outcomes (M3/M4), stats shown for info
function standingsForZone(pairs, matches) {
  if (pairs.length !== 4) return standings(pairs, matches);
  const m1 = matches.find(m => m.matchNum === 1);
  const m2 = matches.find(m => m.matchNum === 2);
  const m3 = matches.find(m => m.matchNum === 3);
  const m4 = matches.find(m => m.matchNum === 4);

  // Derive who played in M3/M4 from M1/M2 results (robust even when m3.p1Id is null in DB)
  let winM1=null, losM1=null, winM2=null, losM2=null;
  if (m1?.winner) { winM1 = m1.winner==='p1'?m1.p1Id:m1.p2Id; losM1 = m1.winner==='p1'?m1.p2Id:m1.p1Id; }
  if (m2?.winner) { winM2 = m2.winner==='p1'?m2.p1Id:m2.p2Id; losM2 = m2.winner==='p1'?m2.p2Id:m2.p1Id; }

  // Enrich m3/m4 in-memory so computeStats counts all 4 matches correctly
  if (m3 && winM1 && winM2) { if (!m3.p1Id) m3.p1Id = winM1; if (!m3.p2Id) m3.p2Id = winM2; }
  if (m4 && losM1 && losM2) { if (!m4.p1Id) m4.p1Id = losM1; if (!m4.p2Id) m4.p2Id = losM2; }

  // Compute actual stats for display (after enriching pair IDs)
  const st = computeStats(pairs, matches);

  if (m3?.winner && m4?.winner && winM1 && winM2 && losM1 && losM2) {
    // 1st: M3 winner, 2nd: M3 loser, 3rd: M4 winner, 4th: M4 loser
    // M3 is winM1 (p1) vs winM2 (p2); M4 is losM1 (p1) vs losM2 (p2)
    const pos1 = m3.winner==='p1' ? winM1 : winM2;
    const pos2 = m3.winner==='p1' ? winM2 : winM1;
    const pos3 = m4.winner==='p1' ? losM1 : losM2;
    const pos4 = m4.winner==='p1' ? losM2 : losM1;
    const result = [pos1,pos2,pos3,pos4].map(id => st[id]||null).filter(Boolean);
    pairs.forEach(p => { if (!result.find(r=>r.pair.id===p.id)) result.push(st[p.id]||{pair:p,pg:0,pp:0,sg:0,sp:0,jg:0,jp:0}); });
    return result;
  }
  // Bracket not complete: fall back to PG-based order (with head-to-head)
  return standings(pairs, matches);
}

function standings(pairs, matches) {
  const st = computeStats(pairs, matches);
  const list = Object.values(st);

  // Head-to-head tiebreaker: when two pairs are tied on PG, the one who beat
  // the other directly ranks higher.
  function headToHead(a, b) {
    const direct = matches.find(m =>
      m.winner && ((m.p1Id===a.pair.id && m.p2Id===b.pair.id) || (m.p1Id===b.pair.id && m.p2Id===a.pair.id))
    );
    if (!direct) return 0;
    if ((direct.p1Id===a.pair.id && direct.winner==='p1') || (direct.p2Id===a.pair.id && direct.winner==='p2')) return -1;
    return 1;
  }

  return list.sort((a,b) => {
    if (b.pg !== a.pg) return b.pg - a.pg;
    // Tied on PG: 1) head-to-head, 2) set diff, 3) game diff
    const h2h = headToHead(a, b);
    if (h2h !== 0) return h2h;
    if ((b.sg-b.sp) !== (a.sg-a.sp)) return (b.sg-b.sp) - (a.sg-a.sp);
    return (b.jg-b.jp) - (a.jg-a.jp);
  });
}

function addHours(timeStr, hours) {
  const [h, m] = (timeStr || '20:00').split(':').map(Number);
  const total = h * 60 + m + hours * 60;
  return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}

function getMatchTime(t, letter, matchIndex) {
  let baseTime = null;
  if (t.zoneAssignments && t.zoneAssignments[letter]) baseTime = t.zoneAssignments[letter].time || '20:00';
  else {
    const zi = letter.charCodeAt(0) - 65;
    if (t.playSlots && t.playSlots[zi]) baseTime = t.playSlots[zi].time || '20:00';
    else if (t.playTime) baseTime = t.playTime;
  }
  if (!baseTime) return null;
  return addHours(baseTime, matchIndex);
}

function formatDay(d) {
  if (!d) return '';
  // ISO date format YYYY-MM-DD → "Sáb 15/09"
  const m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return d; // backward compat: old format like "Lunes"
  const date = new Date(d + 'T12:00:00');
  const names = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  return `${names[date.getDay()]} ${m[3]}/${m[2]}`;
}

function getZoneSchedule(t, letter) {
  // Randomized assignment (set by autoZones)
  if (t.zoneAssignments && t.zoneAssignments[letter]) {
    const slot = t.zoneAssignments[letter];
    if (!slot.day) return null;
    return `${formatDay(slot.day)} ${slot.time || '20:00'}`;
  }
  // Backward compat: sequential playSlots
  const zi = letter.charCodeAt(0) - 65;
  if (t.playSlots && t.playSlots.length > 0) {
    const slot = t.playSlots[zi];
    if (!slot || !slot.day) return null;
    return `${formatDay(slot.day)} ${slot.time || '20:00'}`;
  }
  if (t.playDays && t.playDays.length > 0) {
    return `${t.playDays[zi % t.playDays.length]} ${t.playTime || '20:00'}`;
  }
  return null;
}

function toggleForm(id) {
  const el = document.getElementById(id);
  el.classList.toggle('hidden');
  // Init new-tournament day slots if empty
  if (id === 'form-new-t' && !el.classList.contains('hidden')) {

    if (sc && sc.querySelectorAll('.slot-row').length === 0) addDaySlot('nt-slots');

}

function adjScore(si, side, delta) {
  const maxVal = si < 2 ? 7 : (scoreModal.isThirdSetRegular ? 7 : 11);
  const v = (scoreModal.sets[si][side] ?? 0) + delta;
  scoreModal.sets[si][side] = Math.max(0, Math.min(maxVal, v));
  document.getElementById('sm-error').classList.add('hidden');
  refreshScoreModal();
}

function validateScoreSets(sets, isThirdSetRegular) {
  for (let si = 0; si < 3; si++) {
    const [a, b] = sets[si];
    if (a === 0 && b === 0) continue; // no jugado
    if (si < 2 || isThirdSetRegular) {
      // Set regular: 6-x (x≤4), 7-5, 7-6 (y al revés)
      const ok = (a===6&&b<=4)||(b===6&&a<=4)||(a===7&&(b===5||b===6))||(b===7&&(a===5||a===6));
      if (!ok) return `Set ${si+1}: ${a}-${b} no es válido. Scores posibles: 6-0 a 6-4, 7-5, 7-6.`;
    } else {
      // Super tiebreak: uno debe tener exactamente 11, el otro ≤10
      const ok = (a===11&&b<=10)||(b===11&&a<=10);
      if (!ok) return `Super TB: ${a}-${b} no es válido. Debe ser 11-x con x entre 0 y 10 (ej: 11-8 o 11-10).`;
    }
  }
  return null;
}

function refreshScoreModal() {
  // Update numbers only — winner is NOT shown while editing
  [0,1,2].forEach(si => {
    document.getElementById(`sm-s${si}-0`).textContent = scoreModal.sets[si][0] ?? 0;
    document.getElementById(`sm-s${si}-1`).textContent = scoreModal.sets[si][1] ?? 0;
  });
}

function saveScoreModal() {
  const m = db.matches.find(x=>x.id===scoreModal.matchId); if (!m) return;
  // Validate before saving
  const err = validateScoreSets(scoreModal.sets, scoreModal.isThirdSetRegular);
  if (err) {
    const errEl = document.getElementById('sm-error');
    errEl.textContent = '⚠️ ' + err;
    errEl.classList.remove('hidden');
    return;
  }
  // Convert 0-0 sets to null (unplayed)
  m.sets = scoreModal.sets.map(([a,b]) => (a===0&&b===0) ? [null,null] : [a,b]);
  // Recompute winner
  let p1s=0, p2s=0;
  m.sets.forEach(([a,b]) => {
    if(a!==null&&b!==null){ if(+a>+b)p1s++; else if(+b>+a)p2s++; }
  });
  m.winner = p1s>=2?'p1':p2s>=2?'p2':null;
  // Zone propagation after saving a result
  if (m.phase==='zonas' && m.winner) {
    const zm = db.matches.filter(x=>x.tId===m.tId&&x.zone===m.zone&&x.phase==='zonas').sort((a,b)=>a.matchNum-b.matchNum);
    const m2=zm.find(x=>x.matchNum===2); const m3=zm.find(x=>x.matchNum===3); const m4=zm.find(x=>x.matchNum===4);
    const zonePairs = db.pairs.filter(p=>p.tId===m.tId&&p.zone===m.zone&&!p.suplente);
    const isZone4 = zonePairs.length === 4;
    if (!isZone4) {
      // 3-pair zone: match 1 → populate m2 and m3
      if (m.matchNum===1) {
        if(m2) m2.p1Id = m.winner==='p1'?m.p1Id:m.p2Id;
        if(m3) m3.p1Id = m.winner==='p1'?m.p2Id:m.p1Id;
      }
    } else {
      // 4-pair zone: auto-create m3/m4 if missing (old import data)
      if (!m3) db.matches.push({id:uid(),tId:m.tId,phase:'zonas',zone:m.zone,matchNum:3,p1Id:null,p2Id:null,p1Label:`Gan.${m.zone}1/${m.zone}4`,p2Label:`Gan.${m.zone}2/${m.zone}3`,sets:[[null,null],[null,null],[null,null]],winner:null});
      if (!m4) db.matches.push({id:uid(),tId:m.tId,phase:'zonas',zone:m.zone,matchNum:4,p1Id:null,p2Id:null,p1Label:`Perd.${m.zone}1/${m.zone}4`,p2Label:`Perd.${m.zone}2/${m.zone}3`,sets:[[null,null],[null,null],[null,null]],winner:null});
      // Always ensure m3/m4 have correct pair IDs derived from m1/m2 results
      {
        const zm2=db.matches.filter(x=>x.tId===m.tId&&x.zone===m.zone&&x.phase==='zonas');
        const rm1=zm2.find(x=>x.matchNum===1),rm2=zm2.find(x=>x.matchNum===2),rm3=zm2.find(x=>x.matchNum===3),rm4=zm2.find(x=>x.matchNum===4);
        if(rm1?.winner && rm2?.winner){
          const wM1=rm1.winner==='p1'?rm1.p1Id:rm1.p2Id, lM1=rm1.winner==='p1'?rm1.p2Id:rm1.p1Id;
          const wM2=rm2.winner==='p1'?rm2.p1Id:rm2.p2Id, lM2=rm2.winner==='p1'?rm2.p2Id:rm2.p1Id;
          if(rm3){if(!rm3.p1Id)rm3.p1Id=wM1; if(!rm3.p2Id)rm3.p2Id=wM2; rm3.p1Label=null; rm3.p2Label=null;}
          if(rm4){if(!rm4.p1Id)rm4.p1Id=lM1; if(!rm4.p2Id)rm4.p2Id=lM2; rm4.p1Label=null; rm4.p2Label=null;}
        }
      }
    }
  }
  // Save day/time/photo for bracket matches
  if (scoreModal.isBracket) {
    m.matchDay  = document.getElementById('sm-day').value  || null;
    m.matchTime = document.getElementById('sm-time').value || null;
    // Photo is saved immediately on selection via smPhotoSelected; nothing extra here
  }
  saveDB();
  // Auto-advance bracket when all matches in current phase are done
  if (scoreModal.isBracket && m.winner) {
    autoAdvanceBracketIfReady(m.tId);
  }
  // Show winner briefly before closing
  const winEl = document.getElementById('sm-winner');
  if (m.winner) {
    const name = m.winner==='p1' ? document.getElementById('sm-p1').textContent
                                 : document.getElementById('sm-p2').textContent;
    winEl.textContent = `🏆 Ganó: ${name}`;
    winEl.classList.remove('hidden');
    setTimeout(() => { closeScoreModal(); render(); }, 900);
  } else {
    closeScoreModal(); render();
  }
}

function autoAdvanceBracketIfReady(tId) {
  // Temporarily set activeTId so advanceBracket() works (it uses activeTId internally)
  const prevActiveTId = activeTId;
  activeTId = tId;

  const t = db.tournaments.find(x=>x.id===tId); if (!t) { activeTId = prevActiveTId; return; }
  const bm = db.matches.filter(m=>m.tId===tId && m.phase!=='zonas');
  const bmPhases = BRACKET_ORDER.filter(ph=>bm.some(m=>m.phase===ph));
  if (bmPhases.length === 0) { activeTId = prevActiveTId; return; }

  const currentPhase = bmPhases[bmPhases.length-1];
  if (currentPhase === 'final') { activeTId = prevActiveTId; return; }

  const currentMatches = bm.filter(m=>m.phase===currentPhase);
  if (currentMatches.length === 0 || !currentMatches.every(m=>m.winner)) {
    activeTId = prevActiveTId; return;
  }

  const nextPhase = BRACKET_ORDER[BRACKET_ORDER.indexOf(currentPhase)+1];
  if (!nextPhase) { activeTId = prevActiveTId; return; }
  if (bm.some(m=>m.phase===nextPhase)) { activeTId = prevActiveTId; return; }

  // All good — call the proven advanceBracket logic without alert/confirm
  advanceBracketSilent(tId);
  activeTId = prevActiveTId;

  // Brief toast notification
  showToast(`⚡ ${BRACKET_NAMES[nextPhase]} generada automáticamente`);
}

function advanceBracketSilent(tId) {
  const t = db.tournaments.find(x=>x.id===tId); if (!t) return;
  const bm = db.matches.filter(m=>m.tId===t.id && m.phase!=='zonas');
  const bmPhases = BRACKET_ORDER.filter(ph=>bm.some(m=>m.phase===ph));
  if (bmPhases.length === 0) return;

  const currentPhase = bmPhases[bmPhases.length-1];
  const currentMatches = bm.filter(m=>m.phase===currentPhase).sort((a,b)=>a.matchNum-b.matchNum);
  if (!currentMatches.every(m=>m.winner)) return;
  if (currentPhase === 'final') return;

  const nextPhase = BRACKET_ORDER[BRACKET_ORDER.indexOf(currentPhase)+1];
  if (!nextPhase) return;
  db.matches = db.matches.filter(m=>!(m.tId===t.id && m.phase===nextPhase));

  const winners = currentMatches.map(m=>({
    label: m.winner==='p1' ? m.p1Label : m.p2Label,
    id:    m.winner==='p1' ? m.p1Id   : m.p2Id,
    seed:  m.winner==='p1' ? m.p1Seed : m.p2Seed,
  }));

  const bi = t.bracketInfo || {};
  let mn = 0;

  if (bi.previaPhase && currentPhase === bi.previaPhase && bi.byePairs && bi.byePairs.length > 0) {
    const orderedByePairs = bi.byePairs;
    const nByes      = orderedByePairs.length;
    const mainSlots  = bi.mainSlots || (bi.bSize / 2);
    const seedOrder  = generateBracketSeedOrder(mainSlots);
    let byeIdx = 0, prevIdx = 0;
    const slots = [];
    for (const rank of seedOrder) {
      if (rank <= nByes) slots.push(orderedByePairs[byeIdx++]);
      else { const w = winners[prevIdx++] || {id:null,label:'BYE',seed:null}; slots.push(w); }
    }
    for (let i = 0; i < slots.length - 1; i += 2) {
      mn++;
      const a = slots[i], b = slots[i+1];
      const autoWin = a.id===null?'p2':b.id===null?'p1':null;
      db.matches.push({id:uid(),tId:t.id,phase:nextPhase,zone:null,matchNum:mn,
        p1Id:a.id,p2Id:b.id,p1Label:a.label,p2Label:b.label,
        p1Seed:a.seed||null,p2Seed:b.seed||null,
        sets:[[null,null],[null,null],[null,null]],winner:autoWin});
    }
  } else {
    const nW = winners.length;
    for (let i = 0; i < nW - 1; i += 2) {
      mn++;
      const a = winners[i], b = winners[i+1];
      const autoWin = a.id===null?'p2':b.id===null?'p1':null;
      db.matches.push({id:uid(),tId:t.id,phase:nextPhase,zone:null,matchNum:mn,
        p1Id:a.id,p2Id:b.id,p1Label:a.label,p2Label:b.label,
        p1Seed:a.seed||null,p2Seed:b.seed||null,
        sets:[[null,null],[null,null],[null,null]],winner:autoWin});
    }
    if (nW % 2 === 1) {
      mn++;
      const mid = winners[Math.floor(nW/2)];
      db.matches.push({id:uid(),tId:t.id,phase:nextPhase,zone:null,matchNum:mn,
        p1Id:mid.id,p2Id:null,p1Label:mid.label,p2Label:'BYE',
        p1Seed:mid.seed||null,p2Seed:null,
        sets:[[null,null],[null,null],[null,null]],winner:'p1'});
    }
  }
  saveDB();
}

function showToast(msg) {
  let el = document.getElementById('x3-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'x3-toast';
    el.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A2500;color:#B8FF00;font-size:13px;font-weight:700;padding:10px 20px;border-radius:999px;box-shadow:0 4px 20px rgba(0,0,0,0.3);z-index:9999;transition:opacity 0.4s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ═══════════════════════════════════════════════════════════════════
//  LOCK / UNLOCK
// ═══════════════════════════════════════════════════════════════════
function toggleZoneLock(tId) {
  const t = db.tournaments.find(x=>x.id===tId); if (!t) return;
  if (t.zonesUnlocked) {
    t.zonesUnlocked = false;
  } else {
    if (!confirm('⚠️ Desbloquear las zonas permite editar resultados aunque ya exista un bracket. ¿Continuar?')) return;
    t.zonesUnlocked = true;
  }
  saveDB(); render();
}

function toggleBracketPhaseLock(tId, phase) {
  const t = db.tournaments.find(x=>x.id===tId); if (!t) return;
  t.bracketUnlockedPhases = t.bracketUnlockedPhases || [];
  const idx = t.bracketUnlockedPhases.indexOf(phase);
  if (idx >= 0) {
    t.bracketUnlockedPhases.splice(idx, 1);
  } else {
    if (!confirm(`⚠️ Desbloquear ${BRACKET_NAMES[phase]||phase} permite editar esos resultados aunque haya rondas posteriores. ¿Continuar?`)) return;
    t.bracketUnlockedPhases.push(phase);
  }
  saveDB(); render();
}

// ═══════════════════════════════════════════════════════════════════
//  EDIT PAIR NAMES
// ═══════════════════════════════════════════════════════════════════
let editPairId = null;
function openEditPairModal(pairId) {
  const p = db.pairs.find(x=>x.id===pairId); if (!p) return;
  editPairId = pairId;
  document.getElementById('ep-p1').value = p.p1;
  document.getElementById('ep-p2').value = p.p2;
  document.getElementById('edit-pair-modal').classList.remove('hidden');
}
function closeEditPairModal() {
  document.getElementById('edit-pair-modal').classList.add('hidden');
  editPairId = null;
}
function saveEditPair() {
  const p = db.pairs.find(x=>x.id===editPairId); if (!p) return;
  const p1 = document.getElementById('ep-p1').value.trim();
  const p2 = document.getElementById('ep-p2').value.trim();
  if (!p1 || !p2) { alert('Ingresá ambos nombres'); return; }
  p.p1 = p1; p.p2 = p2;
  const shortLabel = `${p1.split(' ')[0]}/${p2.split(' ')[0]}`;
  // Update match labels that reference this pair
  db.matches.forEach(m => {
    if (m.p1Id === p.id) m.p1Label = shortLabel;
    if (m.p2Id === p.id) m.p2Label = shortLabel;
  });
  // Update bracketInfo byePairs labels
  db.tournaments.forEach(t => {
    if (t.bracketInfo && t.bracketInfo.byePairs) {
      t.bracketInfo.byePairs.forEach(bp => { if (bp.id === p.id) bp.label = shortLabel; });
    }
  });
  saveDB(); closeEditPairModal(); render();
}

function attachMatchPhoto(matchId, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const m = db.matches.find(x=>x.id===matchId); if (!m) return;

    saveDB(); render();
  };
  reader.readAsDataURL(file);
}
function removeMatchPhoto(matchId) {
  const m = db.matches.find(x=>x.id===matchId); if (!m) return;
  m.photo = null; saveDB(); render();
}
let photoViewerMatchId = null;
function openPhotoViewer(matchId) {
  const m = db.matches.find(x=>x.id===matchId); if (!m || !m.photo) return;
  photoViewerMatchId = matchId;
  document.getElementById('photo-viewer-img').src = m.photo;
  document.getElementById('photo-viewer').classList.remove('hidden');
}
function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.add('hidden');
  document.getElementById('photo-viewer-img').src = '';
  photoViewerMatchId = null;
}
function downloadViewerPhoto() {
  if (!photoViewerMatchId) return;
  const m = db.matches.find(x=>x.id===photoViewerMatchId); if (!m || !m.photo) return;
  const a = document.createElement('a');
  a.href = m.photo;
  a.download = `partido.jpg`;
  a.click();
}

<!-- ══ REGISTRO CONFIRMACIÓN MODAL ═════════════════════════════════════════ -->
<div id="reg-modal" onclick="closeRegModal()" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center" style="background:rgba(0,0,0,0.65)">
  <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full sm:max-w-sm mx-0 sm:mx-4 text-center px-6 py-8" onclick="event.stopPropagation()">
    <div id="reg-modal-icon" class="text-5xl mb-3"></div>
    <h2 id="reg-modal-title" class="text-xl font-black text-gray-900 mb-2"></h2>
    <p id="reg-modal-pair" class="text-base font-bold mb-1" style="color:#3d6600"></p>
    <p id="reg-modal-msg" class="text-sm text-gray-500 mb-7"></p>
    <button onclick="closeRegModal()" class="w-full py-3 rounded-xl font-bold text-sm" style="background:#B8FF00;color:#1A2500">¡Listo!</button>
  </div>
</div>

<!-- ══ PHOTO VIEWER ════════════════════════════════════════════════════════ -->
<div id="photo-viewer" onclick="closePhotoViewer()" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,0.85)">
  <div class="relative max-w-lg w-full" onclick="event.stopPropagation()">
    <img id="photo-viewer-img" src="" alt="Foto del partido" class="w-full rounded-2xl shadow-2xl object-contain max-h-[80vh]">
    <div class="flex gap-3 mt-3">
      <button onclick="closePhotoViewer()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white border border-white/30">Cerrar</button>
      <button onclick="downloadViewerPhoto()" class="flex-1 py-2.5 rounded-xl text-sm font-bold" style="background:#B8FF00;color:#1A2500">⬇ Descargar</button>
    </div>
  </div>
</div>

</body>
</html>
